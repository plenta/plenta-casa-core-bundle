twig:
    globals:
        backend_route: '%contao.backend.route_prefix%'
        casa_variables: '@Plenta\CasaCoreBundle\Helper\TwigVariables'
    form_themes:
        - '@Contao/form/form.html.twig'

framework:
    assets:
        packages:
            plentacasacore:
                json_manifest_path: '%kernel.project_dir%/public/bundles/plentacasacore/manifest.json'

plenta_casa_core:
    alias_generation:
        parts:
            - title
            - postal
            - city
        locale: 'de'
        validChars: '0-9a-z'


twig_component:
    anonymous_template_directory: '@Contao/components/'
    defaults:
        Plenta\CasaCoreBundle\Twig\Components\: '@Contao/components/'